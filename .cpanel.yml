---
# cPanel Git deployment for a Rails 8 app served by Phusion Passenger.
#
# Every entry below is a BASH command run as the account user by cPanel's
# deploy hook (on `git push` to this repo, or on "Deploy HEAD Commit" in
# cPanel > Git Version Control > Manage). Exports persist from one task to the
# next, but there is no login shell, so PATH and RAILS_ENV are set explicitly
# and every task re-enters $DEPLOYPATH rather than trusting the working dir.
#
# This deploys *in place* — the checkout at $DEPLOYPATH is the running app, so
# nothing is copied anywhere. That also side-steps cPanel's warning about
# wildcard copies dragging .git and config/credentials/*.key into a docroot.
# The domain's docroot only ever points at $DEPLOYPATH/public (see README).
#
# Anything slow or one-off (compiling Ruby, first `bundle install`, db:seed)
# belongs in the SSH bootstrap, not here: cPanel kills long deploys, and this
# file has to stay fast enough to run on every push.
deployment:
  tasks:
    - export DEPLOYPATH=/home/bgomygmv/hp_inventory_app
    - export RBENV_ROOT=/home/bgomygmv/.rbenv
    - export PATH="$RBENV_ROOT/shims:$RBENV_ROOT/bin:$PATH"
    - export RAILS_ENV=production
    - export BUNDLE_APP_CONFIG="$DEPLOYPATH/.bundle"

    # Uncomment (and mirror into Application Manager's env vars, so Passenger
    # sees them too) if the four production databases had to be created through
    # cPanel > PostgreSQL Databases, which forces the "bgomygmv_" prefix:
    # - export DB_NAME=bgomygmv_hp_inv_prod
    # - export DB_NAME_CACHE=bgomygmv_hp_inv_cache
    # - export DB_NAME_QUEUE=bgomygmv_hp_inv_queue
    # - export DB_NAME_CABLE=bgomygmv_hp_inv_cable

    - echo "==> Deploying $(git -C $DEPLOYPATH rev-parse --short HEAD) with $(cd $DEPLOYPATH && ruby -v)"

    # Gems: locked versions only, into vendor/bundle, no development/test
    # groups. `deployment true` makes a stale Gemfile.lock fail here loudly
    # instead of silently resolving to different versions than were tested.
    # Re-asserted every deploy so a wiped .bundle/config self-heals.
    - cd $DEPLOYPATH && bundle config set --local deployment true
    - cd $DEPLOYPATH && bundle config set --local path vendor/bundle
    - cd $DEPLOYPATH && bundle config set --local without "development:test"
    - cd $DEPLOYPATH && bundle install --jobs 2 --retry 2

    # Runtime dirs: log/ and tmp/ ship as empty .keep'd dirs, and storage/ holds
    # Active Storage blobs, so make sure all of them exist before boot.
    - cd $DEPLOYPATH && mkdir -p log tmp/pids tmp/cache tmp/sockets storage

    # Schema first, assets second: assets:precompile boots the app in
    # production (eager_load = true), and ActiveAdmin's resource definitions
    # introspect their tables while loading.
    #
    # db:prepare creates any missing database, loads db/schema.rb (plus the
    # cache/queue/cable schemas) into fresh ones, and migrates existing ones.
    # If the PostgreSQL role lacks CREATEDB, create the four databases in
    # cPanel > PostgreSQL Databases and set DB_NAME* — see config/database.yml.
    - cd $DEPLOYPATH && bin/rails db:prepare

    # assets:precompile is enhanced by lib/tasks/active_admin.rake, so this
    # also regenerates app/assets/tailwind/active_admin.css. That matters:
    # the generated entrypoint hardcodes an absolute path into the activeadmin
    # gem, which differs between a dev machine and this server, which is why
    # the file is gitignored rather than committed.
    - cd $DEPLOYPATH && bin/rails assets:precompile
    - cd $DEPLOYPATH && bin/rails assets:clean

    # Graceful Passenger restart: the current requests finish on the old
    # process, the next one boots the new code.
    - cd $DEPLOYPATH && touch tmp/restart.txt

    - echo "==> Deployed $(git -C $DEPLOYPATH rev-parse --short HEAD)"

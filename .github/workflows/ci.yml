# Mirrors the Overcommit pre-push hooks (.overcommit.yml + .git-hooks/pre_push)
# so a pull request cannot pass CI on work that would have been rejected
# locally: RuboCop, bundler-audit and the RSpec suite. Brakeman and the
# importmap audit run here as well -- they are too slow to sit on a push.
#
# Job names are the identifiers GitHub uses for required status checks, so
# renaming a job means updating the branch ruleset (see docs/ci.md).
name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# A new push to a PR makes the in-flight run obsolete; don't pay for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan_ruby:
    name: Security (Ruby)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    name: Security (JavaScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    name: Test (RSpec)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hp_inventory
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hp_inventory"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips postgresql-client

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # No RAILS_MASTER_KEY here on purpose. The suite needs no decrypted
      # credential -- the database ones arrive as DB_* below, and in the test
      # environment Rails falls back to a throwaway generated secret_key_base
      # when no key is present. Handing it a key that does not open
      # config/credentials.yml.enc (or that a fork's pull request cannot see
      # at all) is the only way this step can fail on credentials.
      - name: Run tests
        env:
          RAILS_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: hp_inventory
          DB_PASSWORD: postgres
        run: |
          bin/rails db:test:prepare
          bundle exec rspec

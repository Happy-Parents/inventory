default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME") || Rails.application.credentials.dig('db', 'username') || 'hp_inventory' %>
  password: <%= ENV.fetch("DB_PASSWORD") || Rails.application.credentials.dig('db', 'password') || nil %>

development:
  <<: *default
  database: hp_inventory_development

test:
  <<: *default
  database: hp_inventory_test

# Production DBs on one server:
# - primary app db
# - solid cache
# - solid cueue
# - solid cable
# They are created by `db:prepare` on first boot,
# which requires the DB_USERNAME role to have CREATEDB.
production:
  primary:
    <<: *default
    database: hp_inventory_production
  cache:
    <<: *default
    database: hp_inventory_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: hp_inventory_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: hp_inventory_production_cable
    migrations_paths: db/cable_migrate

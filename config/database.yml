default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV["DB_USERNAME"] || Rails.application.credentials.dig(:db, :username) || "hp_inventory" %>
  password: <%= ENV["DB_PASSWORD"] || Rails.application.credentials.dig(:db, :password) %>

development:
  <<: *default
  database: hp_inventory_development

test:
  <<: *default
  database: hp_inventory_test

# Production runs four DBs on one server:
# - primary app db
# - solid cache
# - solid queue
# - solid cable
#
# `db:prepare` creates whichever of them are missing, which needs the
# DB_USERNAME role to hold CREATEDB. Managed hosts (cPanel & co.) usually don't
# grant that and force an account prefix on database names instead, so each
# name can be overridden from the environment: set DB_NAME and the other three
# default to "<DB_NAME>_cache" / "_queue" / "_cable", or name all four
# explicitly with DB_NAME_CACHE / DB_NAME_QUEUE / DB_NAME_CABLE.
<% prod_db = ENV.fetch("DB_NAME", "hp_inventory_production") %>
production:
  primary:
    <<: *default
    database: <%= prod_db %>
  cache:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_CACHE", "#{prod_db}_cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_QUEUE", "#{prod_db}_queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_CABLE", "#{prod_db}_cable") %>
    migrations_paths: db/cable_migrate
